name: Sweetneeds Monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # alle 30 Minuten (GitHub kann sich um einige Minuten verspäten)
  workflow_dispatch: {}       # manuell auslösbar unter "Actions"

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Katalog prüfen
        env:
          NOTIFY_TYPES: ${{ vars.NOTIFY_TYPES }}
          MIN_PRICE_CHANGE_PCT: ${{ vars.MIN_PRICE_CHANGE_PCT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scraper/monitor.py

      - name: Daten speichern
        run: |
          git config user.name "sweetneeds-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Daten-Update $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
